<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buzzivo - Admin Login</title>
    <!-- Modern Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* Warm Espresso / Honey Orange Theme */
            --bg-color: #0f0d0c;
            --card-bg: #1c1614;
            --primary: #ff9f0a;
            --primary-hover: #ffb340;
            --primary-glow: rgba(255, 159, 10, 0.4);
            --text-main: #f5f5f7;
            --text-light: #a1a1a6;
            --input-bg: #25201d;
            --input-border: #3a322e;
            --shadow: 0 20px 50px rgba(0, 0, 0, 0.7), 0 0 30px rgba(255, 159, 10, 0.05);
            --success: #30d158;
            --danger: #ff453a;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background-color: var(--bg-color);
            background-image: radial-gradient(var(--input-border) 1.5px, transparent 1.5px);
            background-size: 24px 24px;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            color: var(--text-main);
            position: relative;
        }

        /* Warm ambient glow behind card */
        body::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 159, 10, 0.08) 0%, transparent 70%);
            z-index: -2;
            pointer-events: none;
        }

        /* Food decorative floating circles */
        .decoration {
            position: absolute;
            border-radius: 50%;
            z-index: -1;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            width: 70px;
            height: 70px;
            background: rgba(28, 22, 20, 0.6);
            border: 2px solid var(--input-border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(10px);
            animation: float 8s ease-in-out infinite;
            transition: 0.3s ease;
            user-select: none;
        }

        .decoration:hover {
            border-color: var(--primary);
            box-shadow: 0 0 20px var(--primary-glow);
            transform: scale(1.1);
        }

        .dec-1 {
            top: 15%;
            left: 15%;
            animation-duration: 9s;
            animation-delay: 0s;
        }

        .dec-2 {
            bottom: 15%;
            left: 20%;
            animation-duration: 7s;
            animation-delay: 1s;
        }

        .dec-3 {
            top: 20%;
            right: 15%;
            animation-duration: 8s;
            animation-delay: 2s;
        }

        .dec-4 {
            bottom: 20%;
            right: 25%;
            animation-duration: 10s;
            animation-delay: 3s;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-25px) rotate(15deg);
            }
        }

        .login-card {
            background: var(--card-bg);
            padding: 40px;
            border-radius: 28px;
            box-shadow: var(--shadow);
            width: 100%;
            max-width: 380px;
            text-align: center;
            border: 1px solid var(--input-border);
            position: relative;
            overflow: hidden;
            animation: popIn 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            transition: border-color 0.5s;
        }

        .login-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--primary), #ffa726, var(--primary));
        }

        @keyframes popIn {
            0% {
                opacity: 0;
                transform: scale(0.9) translateY(30px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .logo-container {
            margin-bottom: 25px;
            position: relative;
            display: inline-block;
        }

        .pager-ring {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            border: 3px dashed var(--primary);
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(255, 159, 10, 0.05);
            animation: rotateRing 20s linear infinite, pulseGlow 2s ease-in-out infinite alternate;
        }

        @keyframes rotateRing {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        @keyframes pulseGlow {
            from { box-shadow: 0 0 10px rgba(255, 159, 10, 0.1); }
            to { box-shadow: 0 0 25px rgba(255, 159, 10, 0.3); }
        }

        .logo-emoji {
            font-size: 2.5rem;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% { transform: translate(-50%, -50%) scale(1); }
            40% { transform: translate(-50%, -60%) scale(1.1); }
            60% { transform: translate(-50%, -55%) scale(1.05); }
        }

        h1 {
            margin: 0;
            font-size: 2.2rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.5px;
        }

        h1 span {
            color: var(--primary);
        }

        h2 {
            margin-top: 5px;
            margin-bottom: 30px;
            color: var(--text-light);
            font-size: 0.95rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: var(--text-main);
            font-weight: 600;
            font-size: 0.9rem;
            letter-spacing: 0.3px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i {
            position: absolute;
            left: 15px;
            color: var(--text-light);
            font-size: 1.1rem;
            transition: color 0.3s;
        }

        input {
            width: 100%;
            padding: 14px 15px 14px 45px;
            border: 2px solid var(--input-border);
            border-radius: 14px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: all 0.3s;
            background: var(--input-bg);
            color: #fff;
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(37, 32, 29, 0.8);
            box-shadow: 0 0 15px var(--primary-glow);
        }

        input:focus + i {
            color: var(--primary);
        }

        button {
            width: 100%;
            padding: 15px;
            background: var(--primary);
            color: var(--bg-color);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-size: 1.1rem;
            font-weight: 700;
            font-family: inherit;
            transition: all 0.3s;
            box-shadow: 0 6px 15px rgba(255, 159, 10, 0.2);
            margin-top: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 159, 10, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        .alert {
            padding: 12px 15px;
            background: rgba(255, 69, 58, 0.1);
            color: var(--danger);
            border-radius: 12px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            border: 1px solid rgba(255, 69, 58, 0.2);
            animation: shake 0.5s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-6px); }
            40%, 80% { transform: translateX(6px); }
        }
    </style>
</head>

<body>

    <div class="decoration dec-1">🍔</div>
    <div class="decoration dec-2">🍟</div>
    <div class="decoration dec-3">📟</div>
    <div class="decoration dec-4">🍕</div>

    <div class="login-card">
        <div class="logo-container">
            <div class="pager-ring"></div>
            <div class="logo-emoji">🍳</div>
        </div>
        <h1>Buzz<span>ivo</span></h1>
        <h2>Kitchen Control Panel</h2>

        {% with messages = get_flashed_messages() %}
        {% if messages %}
        {% for message in messages %}
        <div class="alert">
            <i class="fa-solid fa-triangle-exclamation"></i>
            {{ message }}
        </div>
        {% endfor %}
        {% endif %}
        {% endwith %}

        <form method="POST" action="/login">
            <div class="form-group">
                <label>Chef Username</label>
                <div class="input-wrapper">
                    <input type="text" name="username" required autofocus placeholder="e.g. admin">
                    <i class="fa-solid fa-user"></i>
                </div>
            </div>
            <div class="form-group">
                <label>Access Key</label>
                <div class="input-wrapper">
                    <input type="password" name="password" required placeholder="Enter password">
                    <i class="fa-solid fa-key"></i>
                </div>
            </div>
            <button type="submit">
                <span>Start Shift</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </form>
    </div>

</body>

</html>
